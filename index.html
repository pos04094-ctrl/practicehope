<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 업무 교육 안내 (가상)</title>
<style>
body{font-family:'Malgun Gothic',sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.7}
h1{color:#1e3a5f}
.box{background:#eef1f4;padding:12px 16px;border-radius:8px}
</style>
</head>
<body>
<h1>AI 업무 교육 안내 (가상)</h1>
<p>이 페이지는 배포 연습용 가상 안내문입니다.</p>
<ul>
  <li>대상: 연습 참가자</li>
  <li>내용: AI로 업무 정리하기</li>
  <li>준비물: 노트북, 무료 계정</li>
</ul>
<div class="box" id="live">기온을 불러오는 중…</div>
<script>
(function () {
  var box = document.getElementById('live');
  var FALLBACK = '기온 정보를 지금은 불러올 수 없습니다.';
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 5000);
  fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m', { signal: ctrl.signal })
    .then(function (r) { if (!r.ok) throw new Error('응답 오류'); return r.json(); })
    .then(function (d) {
      var v = d && d.current && d.current.temperature_2m;
      if (typeof v !== 'number') throw new Error('형식 오류');
      box.textContent = '서울 현재 기온: ' + v + '℃ (' + new Date().toLocaleTimeString('ko-KR') + ' 기준)';
    })
    .catch(function () { box.textContent = FALLBACK; })
    .finally(function () { clearTimeout(timer); });
})();
</script>
</body>
</html>
